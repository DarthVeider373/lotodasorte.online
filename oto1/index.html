  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #e0e0e0;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    /* Banner vermelho topo */
    .top-banner {
      background-color: #b71c1c;
      color: white;
      text-align: center;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Container principal */
    .container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
    }

    /* Frame do vídeo (formato celular) */
    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 420px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      border: 4px solid #c0c0c0;
      background: #000;
      aspect-ratio: 9/16;
    }

    .video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Overlay de clique para ouvir */
    .unmute-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 10;
    }

    .unmute-btn {
      background-color: #e53935;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(229, 57, 53, 0.5);
      transition: transform 0.2s;
    }

    .unmute-btn:hover {
      transform: scale(1.05);
    }

    .unmute-btn svg {
      width: 36px;
      height: 36px;
      fill: white;
    }

    .unmute-btn span {
      font-size: 16px;
    }

    /* Legendas */
    .subtitle-bar {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 18px;
      font-weight: 600;
      text-align: center;
      max-width: 90%;
      z-index: 5;
      pointer-events: none;
    }

    /* Esconder overlay após clique */
    .unmute-overlay.hidden {
      display: none;
    }

    @media (max-width: 480px) {
      .top-banner {
        font-size: 12px;
        padding: 10px 15px;
      }

      .container {
        padding: 20px 15px;
      }

      .video-wrapper {
        max-width: 100%;
      }
    }
  </style>
